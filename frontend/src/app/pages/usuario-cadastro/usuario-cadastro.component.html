<section class="card">
  <h2>Cadastro de Usuário</h2>
  <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
    <div class="form-field">
      <label for="nome">Nome</label>
      <input id="nome" formControlName="nome" />
      <span class="erro" *ngIf="form.get('nome')?.touched && form.get('nome')?.errors">
        <ng-container *ngIf="form.get('nome')?.errors?.['required']">
          Nome é obrigatório.
        </ng-container>
        <ng-container *ngIf="form.get('nome')?.errors?.['minlength']">
          Nome deve ter pelo menos 3 caracteres.
        </ng-container>
        <ng-container *ngIf="form.get('nome')?.errors?.['pattern']">
          Nome deve conter apenas letras.
        </ng-container>
    </span>
    </div>
    <div class="form-field">
      <label for="email">Email</label>
      <input id="email" formControlName="email" />
      <span class="erro" *ngIf="form.get('email')?.touched && form.get('email')?.invalid">
        Email é obrigatório e deve ser válido.
      </span>
    </div>
    <div class="form-field">
      <label for="bairro">Bairro</label>
      <input id="bairro" formControlName="bairro" />
      <span class="erro" *ngIf="form.get('bairro')?.touched && form.get('bairro')?.invalid">
        Bairro é obrigatório.
      </span>
    </div>
    <div class="acoes">
      <button type="submit" [disabled]="carregando">Cadastrar</button>
    </div>
    <p class="sucesso" *ngIf="sucessoMsg">{{ sucessoMsg }}</p>
    <p class="erro" *ngIf="erroMsg">{{ erroMsg }}</p>
  </form>
</section>
