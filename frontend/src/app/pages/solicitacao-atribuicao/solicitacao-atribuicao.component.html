<section class="card">
  <h2>Atribuir Funcionário à Solicitação</h2>
  <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
    <div class="form-field">
      <label for="solicitacaoId">Solicitação</label>
      <select id="solicitacaoId" formControlName="solicitacaoId">
        <option value="" disabled selected>Selecione...</option>
        <option *ngFor="let s of (solicitacoes$ | async)" [value]="s.id">
          {{ s.id }} - {{ s.titulo }} | {{ s.nomeSolicitante }} | {{ s.dataSolicitacao | date:'shortDate' }}
        </option>
      </select>
      <span class="erro" *ngIf="form.get('solicitacaoId')?.touched && form.get('solicitacaoId')?.invalid">
        Selecione uma solicitação.
      </span>
    </div>
    <div class="form-field">
      <label for="funcionarioId">Funcionário</label>
      <select id="funcionarioId" formControlName="funcionarioId">
        <option value="" disabled selected>Selecione...</option>
        <option *ngFor="let f of (funcionarios$ | async)" [value]="f.id">
          {{ f.nome }} ({{ f.email }})
        </option>
      </select>
      <span class="erro" *ngIf="form.get('funcionarioId')?.touched && form.get('funcionarioId')?.invalid">
        Selecione um funcionário.
      </span>
    </div>
    <div class="acoes">
      <button type="submit" [disabled]="carregando">Atribuir</button>
    </div>
    <p class="sucesso" *ngIf="sucessoMsg">{{ sucessoMsg }}</p>
    <p class="erro" *ngIf="erroMsg">{{ erroMsg }}</p>
  </form>
</section>
